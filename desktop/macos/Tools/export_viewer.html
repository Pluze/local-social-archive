<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Social Archive Export</title><style>
:root{--green:#07c160;--ink:#17211b;--muted:#748079;--line:#e7ece8}*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:#f5f8f6}header{height:72px;padding:17px 24px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}h1{font-size:18px;margin:0}header span{color:var(--muted)}header input{margin-left:auto;width:min(340px,40vw);padding:9px 12px;border:1px solid var(--line);border-radius:9px}main{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 72px)}nav{background:#fff;border-right:1px solid var(--line);padding:12px;overflow:auto}.item{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:9px;cursor:pointer}.item:hover,.item.active{background:#eaf7ef}.item small{display:block;color:var(--muted)}#content{padding:24px;min-width:0}.card{max-width:820px;margin:0 auto 12px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px}.card.mine{border-left:4px solid var(--green)}.meta{color:var(--muted);font-size:12px}.text{white-space:pre-wrap;margin:8px 0}.media{display:flex;flex-wrap:wrap;gap:8px}.media img,.media video{max-width:320px;max-height:360px;border-radius:8px}.media a{color:#167c49}.empty{text-align:center;color:var(--muted);padding:20vh 20px}.toolbar{max-width:820px;margin:0 auto 12px;display:flex;justify-content:space-between}@media(max-width:700px){main{grid-template-columns:1fr}nav{display:flex;border-right:0;border-bottom:1px solid var(--line);overflow:auto}.item{min-width:180px}header span{display:none}}
</style></head><body><header><h1>Local Social Archive Export</h1><span id="summary">Loading...</span><input id="search" placeholder="Filter this page"></header><main><nav id="nav"></nav><section id="content"><div class="empty">Choose an item</div></section></main><script src="data/manifest.js"></script><script>
const M=window.__WX_MANIFEST__||{type:'unknown',items:[]};const nav=document.querySelector('#nav'),content=document.querySelector('#content'),search=document.querySelector('#search');let current=[],active='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function media(r){if(!r?.exportedPath)return '';const p=encodeURI(r.exportedPath);if(r.kind==='image'&&!p.endsWith('.dat'))return `<img loading="lazy" src="${p}">`;if(r.kind==='video')return `<video controls preload="metadata" src="${p}"></video>`;return `<a href="${p}">Open ${esc(r.original_name||r.kind||'media file')}</a>`}function render(){const q=search.value.trim().toLowerCase(),list=q?current.filter(x=>JSON.stringify(x).toLowerCase().includes(q)):current;if(M.type==='moments'){content.innerHTML=list.map(p=>`<article class="card"><div class="meta">${esc(p.createTimeISO||p.tid)}</div><div class="text">${esc(p.contentDesc)}</div><div class="media">${(p.media||[]).map(media).join('')}</div></article>`).join('')||'<div class="empty">No results</div>';return}content.innerHTML=`<div class="toolbar"><b>${esc(active)}</b><span>${list.length} messages</span></div>`+list.map(m=>`<article class="card ${m.is_self?'mine':''}"><div class="meta">${esc(m.formatted_time||new Date((m.timestamp||0)*1000).toLocaleString())} · ${esc(m.sender_name)} · ${esc(m.label)}</div><div class="text">${esc(m.content)}</div><div class="media">${(m.resources||[]).map(media).join('')}</div></article>`).join('')}function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>{s.remove();ok()};s.onerror=no;document.body.appendChild(s)})}async function openItem(item,button){active=item.displayName||'My Moments';document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));button?.classList.add('active');current=[];content.innerHTML='<div class="empty">Loading...</div>';for(const chunk of item.chunks||[]){await loadScript(chunk);current.push(...(window.__WX_CHUNK__||[]));window.__WX_CHUNK__=[]}render()}nav.innerHTML=(M.items||[]).map((x,i)=>`<button class="item" data-i="${i}">${esc(x.displayName)}<small>${x.count||0} items</small></button>`).join('');nav.querySelectorAll('.item').forEach(b=>b.onclick=()=>openItem(M.items[+b.dataset.i],b));search.oninput=render;document.querySelector('#summary').textContent=`${M.kindLabel||'Archive'} · ${M.total||0} items`;if(M.items?.length)nav.querySelector('.item').click();
</script></body></html>
