<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Social Archive</title><style>
:root{color-scheme:light dark;--bg:#f4f7f5;--panel:#fff;--ink:#17211b;--muted:#748079;--line:#dfe7e2;--accent:#078b66}@media(prefers-color-scheme:dark){:root{--bg:#111713;--panel:#19211c;--ink:#edf5ef;--muted:#98a79d;--line:#2b3930;--accent:#25c99a}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:12px;align-items:center}h1{font-size:18px;margin:0}header span{color:var(--muted)}input{margin-left:auto;min-width:250px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink)}main{display:grid;grid-template-columns:290px minmax(0,1fr);height:calc(100vh - 65px)}nav{border-right:1px solid var(--line);overflow:auto;padding:10px}.item{width:100%;border:0;border-radius:10px;background:transparent;color:var(--ink);padding:11px;text-align:left;cursor:pointer}.item:hover,.item.active{background:color-mix(in srgb,var(--accent) 12%,var(--panel))}.item small{display:block;color:var(--muted)}#content{overflow:auto;padding:22px}.card{max-width:850px;margin:0 auto 12px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px}.meta{color:var(--muted);font-size:12px;margin-bottom:7px}.text{white-space:pre-wrap;word-break:break-word}.mine{border-left:3px solid var(--accent)}.media{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.media a{display:inline-flex;min-height:42px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--bg);color:var(--accent);text-decoration:none}.media img,.media video,.media audio{max-width:min(320px,100%);max-height:360px;border-radius:8px}.toolbar{max-width:850px;margin:0 auto 14px;display:flex;justify-content:space-between}.empty{height:65vh;display:grid;place-items:center;color:var(--muted)}@media(max-width:760px){main{grid-template-columns:1fr}nav{max-height:180px;border-right:0;border-bottom:1px solid var(--line)}input{min-width:120px}}
</style></head><body><header><h1 id="title">Local Social Archive</h1><span id="summary">Loading…</span><input id="search" placeholder="Filter current collection"></header><main><nav id="nav"></nav><section id="content"><div class="empty">Choose a collection</div></section></main><script src="data/manifest.js"></script><script>
const M=window.__ARCHIVE_MANIFEST__||{items:[]};const nav=document.querySelector('#nav'),content=document.querySelector('#content'),search=document.querySelector('#search');let current=[],active='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function media(r){if(!r?.exportedPath)return '';const p=encodeURI(r.exportedPath),label=esc(r.name||r.kind||'media');if(r.kind==='image')return `<img loading="lazy" src="${p}" alt="${label}">`;if(r.kind==='video')return `<video controls preload="metadata" src="${p}"></video>`;if(r.kind==='audio')return `<audio controls preload="metadata" src="${p}"></audio>`;return `<a href="${p}">↗ ${label}</a>`}function render(){const q=search.value.trim().toLowerCase(),list=q?current.filter(x=>JSON.stringify(x).toLowerCase().includes(q)):current;content.innerHTML=`<div class="toolbar"><b>${esc(active)}</b><span>${list.length}</span></div>`+(list.map(x=>`<article class="card ${x.isSelf?'mine':''}"><div class="meta">${esc(x.timestamp??'')} · ${esc(x.author)} · ${esc(x.category)}</div><div class="text">${esc(x.text)}</div><div class="media">${(x.media||[]).map(media).join('')}</div></article>`).join('')||'<div class="empty">No results</div>')}function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>{s.remove();ok()};s.onerror=no;document.body.appendChild(s)})}async function openItem(item,button){active=item.title;document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));button?.classList.add('active');current=[];content.innerHTML='<div class="empty">Loading…</div>';for(const chunk of item.chunks||[]){await loadScript(chunk);current.push(...(window.__ARCHIVE_CHUNK__||[]));window.__ARCHIVE_CHUNK__=[]}render()}document.querySelector('#title').textContent=M.title||'Local Social Archive';document.querySelector('#summary').textContent=`${M.total||0} entries`;nav.innerHTML=(M.items||[]).map((x,i)=>`<button class="item" data-i="${i}">${esc(x.title)}<small>${x.count||0}</small></button>`).join('');nav.querySelectorAll('.item').forEach(b=>b.onclick=()=>openItem(M.items[+b.dataset.i],b));search.oninput=render;if(M.items?.length)nav.querySelector('.item').click();
</script></body></html>
